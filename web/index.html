<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Study Podcast — Painel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/app.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">AI Study Podcast</span>
      <span id="connection-badge" class="badge text-bg-secondary">desconectado</span>
    </div>
  </nav>

  <main class="container pb-5">
    <section class="card mb-4 shadow-sm">
      <div class="card-body">
        <h2 class="h5 card-title">Configuração</h2>
        <div class="row g-2 align-items-end">
          <div class="col-md-8">
            <label class="form-label" for="token">Token API</label>
            <input type="password" class="form-control" id="token" placeholder="STUDY_PLAN_CREATE_TOKEN" />
          </div>
          <div class="col-md-4">
            <button type="button" class="btn btn-primary w-100" id="save-token">Salvar e conectar</button>
          </div>
        </div>
      </div>
    </section>

    <section class="card mb-4 shadow-sm">
      <div class="card-body">
        <h2 class="h5 card-title">Criar plano de estudos</h2>
        <form id="create-form" class="row g-3">
          <div class="col-md-4">
            <label class="form-label" for="title">Título</label>
            <input class="form-control" id="title" required />
          </div>
          <div class="col-md-6">
            <label class="form-label" for="goal">Objetivo</label>
            <input class="form-control" id="goal" required />
          </div>
          <div class="col-md-2 d-flex align-items-end">
            <button type="submit" class="btn btn-success w-100">Criar</button>
          </div>
        </form>
        <div id="create-alert" class="alert mt-3 d-none" role="alert"></div>
      </div>
    </section>

    <section class="card shadow-sm">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span>Planos de estudo</span>
        <button type="button" class="btn btn-sm btn-outline-secondary" id="refresh-plans">Atualizar</button>
      </div>
      <div class="card-body p-0">
        <div id="plans-empty" class="p-4 text-muted">Configure o token para listar os planos.</div>
        <div id="plans-list" class="list-group list-group-flush"></div>
      </div>
    </section>
  </main>

  <div class="modal fade" id="detail-modal" tabindex="-1">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="detail-title">Plano de estudos</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="plan-detail"></div>
        </div>
        <div class="modal-footer">
          <select class="form-select form-select-sm w-auto" id="generate-mode">
            <option value="DISCUSSION">Discussão</option>
            <option value="INTERVIEW">Entrevista</option>
          </select>
          <button type="button" class="btn btn-primary btn-sm" id="generate-next">Gerar próximo</button>
          <button type="button" class="btn btn-danger btn-sm" id="delete-plan">Remover</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="toast" class="toast" role="alert">
      <div class="toast-header"><strong class="me-auto">Painel</strong><button type="button" class="btn-close" data-bs-dismiss="toast"></button></div>
      <div class="toast-body"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
