services:
  app:
    build:
      context: .
    env_file:
      - .env
    environment:
      FFMPEG_PATH: /usr/bin/ffmpeg
      AUDIO_STORAGE_PATH: /app/storage/podcasts
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - podcast-audio:/app/storage/podcasts
    restart: unless-stopped

volumes:
  podcast-audio:
